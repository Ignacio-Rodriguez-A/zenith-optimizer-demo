name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript estricto)
        run: npm run typecheck
      - name: Regresion del motor (casos + fuzz contra fuerza bruta)
        run: npm test
      - name: Validacion de plantillas de ejemplo
        run: npm run validar
      - name: Build de produccion
        run: npm run build
